<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Screen Probe</title>
<style>
  :root {
    --bg: #0f1115;
    --ink: #f2f4f8;
    --dim: #9aa4b2;
    --cell: #1c2128;
    --cell-edge: #333b47;
    --hit: #2ea043;
    --frame: #e5484d;
    --shape: #f0b429;
    --panel: rgba(8, 10, 14, .88);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }

  /* Edge frame — if any side is missing in a screenshot, the image is cropped. */
  #frame {
    position: fixed; inset: 0; border: 3px solid var(--frame);
    pointer-events: none; z-index: 40;
  }
  .corner {
    position: fixed; z-index: 60; pointer-events: none;
    font-size: 11px; font-weight: 700; color: var(--frame);
    background: var(--panel); padding: 1px 4px; border-radius: 3px;
  }
  #cTL { top: 5px; left: 5px; } #cTR { top: 5px; right: 5px; }
  #cBL { bottom: 5px; left: 5px; } #cBR { bottom: 5px; right: 5px; }

  /* Tap grid fills the viewport edge to edge. */
  #grid {
    position: fixed; inset: 0; display: grid; gap: 2px; padding: 2px; z-index: 10;
  }
  .cell {
    background: var(--cell); border: 1px solid var(--cell-edge); border-radius: 3px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--dim); overflow: hidden;
  }
  .cell.hit { background: var(--hit); color: #fff; border-color: #56d364; font-weight: 700; }

  /* Aspect reference: a true square with a true circle inside. Stretched video or a
     mis-sized screenshot turns the square into a rectangle and the circle into an ellipse. */
  #shape {
    position: fixed; z-index: 30; pointer-events: none;
    left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(38vw, 38vh); height: min(38vw, 38vh);
    border: 3px solid var(--shape);
  }
  #shape::after {
    content: ""; position: absolute; inset: 0; border: 3px solid var(--shape);
    border-radius: 50%; opacity: .85;
  }
  #diag { position: fixed; inset: 0; z-index: 29; pointer-events: none; }

  .panel {
    position: fixed; z-index: 50; background: var(--panel);
    border: 1px solid var(--cell-edge); border-radius: 6px;
    padding: 6px 8px; font-size: 13px; line-height: 1.45;
  }
  #readout {
    pointer-events: none;
    top: 6px; left: 50%; transform: translateX(-50%);
    text-align: center; max-width: 92vw; white-space: normal;
    font-size: clamp(10px, 3.1vw, 14px);
  }
  #readout b { color: #58a6ff; font-weight: 700; }
  #readout .chg { color: var(--shape); }
  #log {
    pointer-events: none;
    bottom: 10px; left: 10px; max-width: 74vw; text-align: left;
    font-size: clamp(10px, 2.8vw, 13px);
  }
  #log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log .last { color: #56d364; font-weight: 700; }
  #ctl { bottom: 10px; right: 10px; display: flex; gap: 6px; }
  /* With the panels hidden every cell is reachable, corners included. */
  body.bare #readout, body.bare #log, body.bare #ctl { display: none; }
  #restore {
    position: fixed; z-index: 55; bottom: 4px; right: 4px;
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--panel); border: 1px solid var(--cell-edge); color: var(--dim);
    font: inherit; font-size: 13px; line-height: 1; display: none;
  }
  body.bare #restore { display: block; }
  #ctl button {
    font: inherit; font-size: 12px; background: var(--cell); color: var(--ink);
    border: 1px solid var(--cell-edge); border-radius: 4px; padding: 4px 7px;
  }
  /* A size change flashes the readout so it is obvious the page saw it. */
  @keyframes flash { 0%,100% { background: var(--panel); } 50% { background: #7a4d00; } }
  .flash { animation: flash .5s ease-in-out 3; }
</style>
</head>
<body>

<div id="grid"></div>
<svg id="diag"><line id="d1"/><line id="d2"/></svg>
<div id="shape"></div>
<div id="frame"></div>
<div class="corner" id="cTL">TL</div>
<div class="corner" id="cTR">TR</div>
<div class="corner" id="cBL">BL</div>
<div class="corner" id="cBR">BR</div>

<div class="panel" id="readout">loading…</div>
<div class="panel" id="ctl">
  <button id="density">grid 5×8</button>
  <button id="clear">clear</button>
  <button id="hide">hide</button>
</div>
<button id="restore" title="show panels">&#9635;</button>
<div class="panel" id="log"><div>no taps yet</div></div>

<script>
(function () {
  "use strict";

  var DENSITIES = [[3, 5], [5, 8], [7, 12]];
  var di = 1;                       // current density index
  var taps = [];                    // rolling tap log
  var tapNo = 0;
  var resizes = 0;
  var lastResize = Date.now();

  var grid = document.getElementById("grid");
  var readout = document.getElementById("readout");
  var logEl = document.getElementById("log");
  var densityBtn = document.getElementById("density");

  function label(r, c) { return "R" + r + "C" + c; }

  function buildGrid() {
    // Deliberately NOT swapped for landscape. Cells go wide and short on a landscape
    // screen, which is the price of R8C1 meaning the same cell on every device and in
    // every orientation - a near-square screen would otherwise flip the whole label
    // space on a 10px difference.
    var cols = DENSITIES[di][0], rows = DENSITIES[di][1];

    grid.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
    grid.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";
    grid.textContent = "";

    for (var r = 1; r <= rows; r++) {
      for (var c = 1; c <= cols; c++) {
        var d = document.createElement("div");
        d.className = "cell";
        d.dataset.id = label(r, c);
        d.textContent = label(r, c);
        grid.appendChild(d);
      }
    }
    densityBtn.textContent = "grid " + cols + "×" + rows;
  }

  function drawDiagonals() {
    var s = document.getElementById("diag");
    var w = window.innerWidth, h = window.innerHeight;
    s.setAttribute("viewBox", "0 0 " + w + " " + h);
    s.setAttribute("width", w); s.setAttribute("height", h);
    var set = function (el, x1, y1, x2, y2) {
      el.setAttribute("x1", x1); el.setAttribute("y1", y1);
      el.setAttribute("x2", x2); el.setAttribute("y2", y2);
      el.setAttribute("stroke", "#f0b429"); el.setAttribute("stroke-width", "1");
      el.setAttribute("opacity", ".45");
    };
    set(document.getElementById("d1"), 0, 0, w, h);
    set(document.getElementById("d2"), w, 0, 0, h);
  }

  function renderReadout(changed) {
    var w = window.innerWidth, h = window.innerHeight;
    var dpr = window.devicePixelRatio || 1;
    var phys = Math.round(w * dpr) + "×" + Math.round(h * dpr);
    var ori = w >= h ? "landscape" : "portrait";
    var since = Math.round((Date.now() - lastResize) / 1000);

    readout.innerHTML =
      "css <b>" + w + "×" + h + "</b>" +
      " · dpr <b>" + dpr + "</b>" +
      " · physical <b>" + phys + "</b>" +
      " · screen <b>" + screen.width + "×" + screen.height + "</b>" +
      " · " + ori +
      " · resizes <span class='chg'>" + resizes + "</span> (" + since + "s ago)";

    if (changed) {
      readout.classList.remove("flash");
      void readout.offsetWidth;          // restart the animation
      readout.classList.add("flash");
    }
  }

  function renderLog() {
    if (!taps.length) { logEl.innerHTML = "<div>no taps yet</div>"; return; }
    logEl.textContent = "";
    taps.slice(-5).forEach(function (t, i, a) {
      var d = document.createElement("div");
      if (i === a.length - 1) d.className = "last";
      d.textContent = "#" + t.n + "  hit " + t.id + "  @ css(" + t.x + "," + t.y +
                      ")  phys(" + t.px + "," + t.py + ")";
      logEl.appendChild(d);
    });
  }

  function onTap(ev) {
    var pt = ev.changedTouches ? ev.changedTouches[0] : ev;
    var x = Math.round(pt.clientX), y = Math.round(pt.clientY);
    var dpr = window.devicePixelRatio || 1;

    var el = document.elementFromPoint(x, y);
    var cell = el && el.classList && el.classList.contains("cell") ? el : null;

    var prev = grid.querySelector(".cell.hit");
    if (prev) prev.classList.remove("hit");
    if (cell) cell.classList.add("hit");

    taps.push({
      n: ++tapNo,
      id: cell ? cell.dataset.id : "GAP",
      x: x, y: y,
      px: Math.round(x * dpr), py: Math.round(y * dpr)
    });
    renderLog();
  }

  function onResize() {
    resizes++;
    lastResize = Date.now();
    buildGrid();
    drawDiagonals();
    renderReadout(true);
  }

  var lastTouch = 0;
  grid.addEventListener("touchend", function (e) {
    lastTouch = Date.now();
    onTap(e);
  }, { passive: true });
  grid.addEventListener("click", function (e) {
    // A real finger also emits a synthetic click ~300ms after touchend; ignore it
    // so one tap is one log line. Mouse-driven sessions only ever reach this path.
    if (Date.now() - lastTouch < 700) return;
    onTap(e);
  });

  window.addEventListener("resize", onResize);
  window.addEventListener("orientationchange", onResize);
  if (window.visualViewport) window.visualViewport.addEventListener("resize", onResize);

  densityBtn.addEventListener("click", function (e) {
    e.stopPropagation();
    di = (di + 1) % DENSITIES.length;
    buildGrid();
  });
  document.getElementById("hide").addEventListener("click", function (e) {
    e.stopPropagation();
    document.body.classList.add("bare");
  });
  document.getElementById("restore").addEventListener("click", function (e) {
    e.stopPropagation();
    document.body.classList.remove("bare");
  });

  document.getElementById("clear").addEventListener("click", function (e) {
    e.stopPropagation();
    taps = []; tapNo = 0;
    var prev = grid.querySelector(".cell.hit");
    if (prev) prev.classList.remove("hit");
    renderLog();
  });

  buildGrid();
  drawDiagonals();
  renderReadout(false);
  setInterval(function () { renderReadout(false); }, 1000);
})();
</script>
</body>
</html>
